<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Dispatch | Passport Automation System</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/style.css"></head>
<body class="dashboard-shell text-slate-900"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="flex flex-col gap-4 rounded-2xl bg-blue-950 px-6 py-5 text-white shadow-lg md:flex-row md:items-center md:justify-between"><div><p class="text-xs uppercase tracking-[0.25em] text-blue-200">Passport Automation System</p><h1 class="mt-2 text-2xl font-bold">Admin Dispatch</h1><p id="admin-name" class="mt-1 text-sm text-blue-100"></p></div><nav class="flex flex-wrap items-center gap-2 text-sm font-medium text-blue-100"><a class="rounded-lg px-3 py-2 hover:bg-white/10" href="/admin-passport-generation.html">Generation</a><a class="rounded-lg bg-white/10 px-3 py-2" href="/admin-dispatch.html">Dispatch</a><button id="logout-button" class="button-secondary !bg-white/10 !text-white hover:!bg-white/15">Logout</button></nav></header><main class="mt-8 space-y-8"><section class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4"><div class="summary-card p-5"><p class="text-sm text-slate-500">Generated Passports</p><p id="total-generated-passports" class="mt-4 text-3xl font-bold">0</p></div><div class="summary-card p-5"><p class="text-sm text-slate-500">Ready for Dispatch</p><p id="ready-for-dispatch" class="mt-4 text-3xl font-bold">0</p></div><div class="summary-card p-5"><p class="text-sm text-slate-500">Dispatched</p><p id="dispatched" class="mt-4 text-3xl font-bold">0</p></div><div class="summary-card p-5"><p class="text-sm text-slate-500">Recent Dispatches</p><p id="recent-dispatch-count" class="mt-4 text-3xl font-bold">0</p></div></section><section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"><div class="grid gap-3 md:grid-cols-4"><input id="search" class="field-input" placeholder="Search application or applicant"><select id="status" class="field-input"><option value="">All statuses</option><option value="PASSPORT_GENERATED">Ready for Dispatch</option><option value="PASSPORT_DISPATCHED">Dispatched</option></select><select id="sort" class="field-input"><option value="newest">Newest updated</option><option value="oldest">Oldest updated</option></select><button id="refresh-button" class="button-secondary">Refresh queue</button></div><div id="queue-message" class="message hidden"></div><div class="mt-6 overflow-x-auto"><table class="w-full min-w-[900px] text-left text-sm"><thead class="border-b border-slate-200 text-xs uppercase tracking-wide text-slate-500"><tr><th class="px-3 py-3">Application</th><th class="px-3 py-3">Applicant</th><th class="px-3 py-3">Passport</th><th class="px-3 py-3">Issue Date</th><th class="px-3 py-3">Status</th><th class="px-3 py-3">Dispatch</th><th class="px-3 py-3">Action</th></tr></thead><tbody id="dispatch-body"></tbody></table></div><div id="pagination" class="mt-5 flex items-center justify-between text-sm text-slate-500"></div></section></main></div><script src="/js/api.js"></script><script src="/js/admin-dispatch.js"></script></body></html>
