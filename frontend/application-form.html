<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form | Passport Automation System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-5xl px-6 py-12">
        <div class="mb-6 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
            <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
                <div>
                    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-teal-700">Application Form</p>
                    <h1 class="mt-1 text-3xl font-bold">Passport Application</h1>
                </div>
                <a href="/dashboard.html" class="button-ghost">Dashboard</a>
            </div>
            <div class="mt-6 flex flex-wrap gap-2 text-xs font-semibold uppercase text-slate-500">
                <span class="rounded-full bg-blue-900 px-3 py-1 text-white">Step 1 Personal</span>
                <span class="rounded-full bg-slate-100 px-3 py-1">Step 2 Address</span>
                <span class="rounded-full bg-slate-100 px-3 py-1">Step 3 Family</span>
                <span class="rounded-full bg-slate-100 px-3 py-1">Step 4 Passport</span>
                <span class="rounded-full bg-slate-100 px-3 py-1">Step 5 Review</span>
            </div>
        </div>
        <div id="application-form-root" class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200"></div>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/application-form.js"></script>
</body>
</html>
