<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Dashboard | Passport Automation System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-shell text-slate-900">
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <header class="flex flex-col gap-4 rounded-2xl bg-blue-950 px-6 py-5 text-white shadow-lg shadow-slate-200 md:flex-row md:items-center md:justify-between">
            <div>
                <p class="text-xs uppercase tracking-[0.25em] text-blue-200">Passport Automation System</p>
                <h1 class="mt-2 text-2xl font-bold">Dashboard</h1>
            </div>
            <nav class="flex flex-wrap items-center gap-3 text-sm font-medium text-blue-100">
                <a class="rounded-lg bg-white/10 px-3 py-2" href="/dashboard.html">Dashboard</a>
                <a class="rounded-lg px-3 py-2 hover:bg-white/10" href="/new-application.html">New Application</a>
                <a class="rounded-lg px-3 py-2 hover:bg-white/10" href="/passport-details.html">Passport</a>
                <button id="logout-button" class="button-secondary !bg-white/10 !text-white hover:!bg-white/15">Logout</button>
            </nav>
        </header>

        <main class="mt-8 space-y-8">
            <section class="grid gap-4 md:grid-cols-2 xl:grid-cols-5">
                <div class="summary-card p-5">
                    <p class="text-sm text-slate-500">Total Applications</p>
                    <p id="total-applications" class="mt-4 text-3xl font-bold text-slate-900">0</p>
                </div>
                <div class="summary-card p-5">
                    <p class="text-sm text-slate-500">Draft Applications</p>
                    <p id="draft-applications" class="mt-4 text-3xl font-bold text-slate-900">0</p>
                </div>
                <div class="summary-card p-5">
                    <p class="text-sm text-slate-500">Under Processing</p>
                    <p id="processing-applications" class="mt-4 text-3xl font-bold text-slate-900">0</p>
                </div>
                <div class="summary-card p-5">
                    <p class="text-sm text-slate-500">Approved</p>
                    <p id="approved-applications" class="mt-4 text-3xl font-bold text-slate-900">0</p>
                </div>
                <div class="summary-card p-5">
                    <p class="text-sm text-slate-500">Rejected</p>
                    <p id="rejected-applications" class="mt-4 text-3xl font-bold text-slate-900">0</p>
                </div>
            </section>

            <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">Recent Applications</h2>
                    </div>
                    <button id="apply-button" class="button-primary">Apply for Passport</button>
                </div>
                <div id="applications-container" class="mt-6 space-y-4"></div>
            </section>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
