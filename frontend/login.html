<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Passport Automation System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <main class="flex min-h-screen items-center justify-center px-6 py-12">
        <section class="w-full max-w-md rounded-3xl bg-white p-8 shadow-xl shadow-slate-200/70 ring-1 ring-slate-200 md:p-10">
            <a class="text-sm font-semibold text-blue-800" href="/">&larr; Passport Automation System</a>
            <h1 class="mt-8 text-3xl font-bold text-slate-950">Welcome back</h1>
            <p class="mt-2 text-slate-600">Sign in to continue your application journey.</p>
            <div id="form-message" class="message hidden" role="alert"></div>
            <form id="login-form" class="mt-8 space-y-5" novalidate>
                <label class="field-label">Email<input class="field-input" name="email" type="email" autocomplete="email" required></label>
                <label class="field-label">Password<input class="field-input" name="password" type="password" autocomplete="current-password" required></label>
                <button class="button-primary w-full" type="submit">Log in</button>
            </form>
            <p class="mt-7 text-center text-sm text-slate-600">New applicant? <a class="font-semibold text-blue-800" href="/register.html">Create an account</a></p>
        </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
