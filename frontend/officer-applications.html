<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Officer Applications | Passport Automation System</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/style.css"></head>
<body class="dashboard-shell text-slate-900"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="flex flex-col gap-4 rounded-2xl bg-blue-950 px-6 py-5 text-white shadow-lg md:flex-row md:items-center md:justify-between"><div><p class="text-xs uppercase tracking-[0.25em] text-blue-200">Passport Automation System</p><h1 class="mt-2 text-2xl font-bold">Application Queue</h1></div><nav class="flex flex-wrap items-center gap-2 text-sm font-medium text-blue-100"><a class="rounded-lg px-3 py-2 hover:bg-white/10" href="/officer-dashboard.html">Dashboard</a><a class="rounded-lg bg-white/10 px-3 py-2" href="/officer-applications.html">Applications</a><button id="logout-button" class="button-secondary !bg-white/10 !text-white hover:!bg-white/15">Logout</button></nav></header>
<main class="mt-8 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"><div class="grid gap-3 md:grid-cols-4"><input id="search" class="field-input" placeholder="Search ID, applicant, type"><select id="status" class="field-input"><option value="">All statuses</option><option>SUBMITTED</option><option>DOCUMENT_VERIFICATION</option><option>INTERVIEW_SCHEDULED</option><option>POLICE_VERIFICATION</option><option>APPROVED</option><option>REJECTED</option></select><select id="application-type" class="field-input"><option value="">All types</option><option>NEW</option><option>RENEWAL</option><option>REISSUE</option></select><select id="sort" class="field-input"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="status">Status</option></select></div><div id="queue-message" class="message hidden"></div><div class="mt-6 overflow-x-auto"><table class="w-full min-w-[850px] text-left text-sm"><thead class="border-b border-slate-200 text-xs uppercase tracking-wide text-slate-500"><tr><th class="px-3 py-3">Application</th><th class="px-3 py-3">Applicant</th><th class="px-3 py-3">Type</th><th class="px-3 py-3">Submitted</th><th class="px-3 py-3">Status</th><th class="px-3 py-3">Documents</th><th class="px-3 py-3">Interview</th><th class="px-3 py-3">Action</th></tr></thead><tbody id="applications-body"></tbody></table></div><div id="pagination" class="mt-5 flex items-center justify-between text-sm text-slate-500"></div></main></div><script src="/js/api.js"></script><script src="/js/officer-applications.js"></script></body></html>
