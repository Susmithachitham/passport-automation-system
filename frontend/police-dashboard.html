<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Police Dashboard | Passport Automation System</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/style.css"></head>
<body class="dashboard-shell text-slate-900"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="flex flex-col gap-4 rounded-2xl bg-blue-950 px-6 py-5 text-white shadow-lg md:flex-row md:items-center md:justify-between"><div><p class="text-xs uppercase tracking-[0.25em] text-blue-200">Passport Automation System</p><h1 class="mt-2 text-2xl font-bold">Police Dashboard</h1><p id="police-name" class="mt-1 text-sm text-blue-100"></p></div><nav class="flex flex-wrap items-center gap-2 text-sm font-medium text-blue-100"><a class="rounded-lg bg-white/10 px-3 py-2" href="/police-dashboard.html">Dashboard</a><a class="rounded-lg px-3 py-2 hover:bg-white/10" href="/police-applications.html">Verification Queue</a><button id="logout-button" class="button-secondary !bg-white/10 !text-white hover:!bg-white/15">Logout</button></nav></header><main class="mt-8 space-y-8"><section class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4"><div class="summary-card p-5"><p class="text-sm text-slate-500">Pending Verification</p><p id="pending-verification" class="mt-4 text-3xl font-bold">0</p></div><div class="summary-card p-5"><p class="text-sm text-slate-500">Clear</p><p id="clear-cases" class="mt-4 text-3xl font-bold">0</p></div><div class="summary-card p-5"><p class="text-sm text-slate-500">Not Clear</p><p id="not-clear-cases" class="mt-4 text-3xl font-bold">0</p></div><div class="summary-card p-5"><p class="text-sm text-slate-500">Total Cases</p><p id="total-cases" class="mt-4 text-3xl font-bold">0</p></div></section><section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"><div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"><div><h2 class="text-xl font-bold">Police Verification Queue</h2><p class="mt-1 text-sm text-slate-500">Review applications forwarded by the Passport Officer.</p></div><a class="button-primary" href="/police-applications.html">Open queue</a></div><div id="recent-cases" class="mt-6 grid gap-3 md:grid-cols-2"></div></section></main></div><script src="/js/api.js"></script><script src="/js/police-dashboard.js"></script></body></html>
